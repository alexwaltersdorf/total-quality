name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on Hostinger (CloudLinux + Passenger)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          command_timeout: 30m
          script: |
            set -e

            NODE_BIN="/opt/alt/alt-nodejs22/root/usr/bin"
            PNPM="/opt/alt/alt-nodejs22/root/usr/lib/node_modules/corepack/shims/pnpm"
            export PATH="$NODE_BIN:$PATH"
            export RAYON_NUM_THREADS=1
            export UV_THREADPOOL_SIZE=1
            export NODE_OPTIONS="--max-old-space-size=1024"

            if [ ! -x "$NODE_BIN/node" ]; then echo "ERRO: Node nao encontrado"; exit 1; fi
            if [ ! -f "$PNPM" ]; then echo "ERRO: pnpm shim nao encontrado"; exit 1; fi

            cd "${{ secrets.HOSTINGER_PATH }}"

            echo "==> [1/6] Pull do branch main"
            git fetch origin main
            git reset --hard origin/main

            echo "==> [2/6] Instalando dependencias (build scripts permitidos via package.json)"
            "$PNPM" install --frozen-lockfile

            echo "==> [3/6] Restaurando bit de execucao dos binarios (workaround CageFS)"
            find node_modules -path "*/.bin/*" -type f -exec chmod +x {} \; 2>/dev/null || true
            find node_modules/.pnpm -name "*.cjs" -path "*/bin/*" -exec chmod +x {} \; 2>/dev/null || true
            find node_modules/.pnpm -name "*.js" -path "*/bin/*" -exec chmod +x {} \; 2>/dev/null || true

            echo "==> [4/6] Build da aplicacao (single-threaded)"
            "$PNPM" build

            echo "==> [5/6] Restart via Phusion Passenger"
            mkdir -p tmp
            touch tmp/restart.txt

            echo "==> [6/6] Deploy OK em $(date '+%Y-%m-%d %H:%M:%S')"
            echo "    Node:  $(node --version)"
            echo "    pnpm:  $("$PNPM" --version)"
