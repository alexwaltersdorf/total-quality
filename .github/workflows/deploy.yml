name: Deploy to Hostinger

# O build acontece AQUI, no runner do GitHub (RAM de sobra, ~40s), e o
# servidor recebe apenas o dist/ pronto. Antes o `pnpm build` rodava por SSH
# dentro da Hostinger, cujo limite de 1 GB de heap derrubava o Vite com
# "JavaScript heap out of memory" — 100% das execuções falharam entre
# 04/06 e 19/08/2026 e NADA chegou a produção nesse período.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build no runner + publicação na Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ativar corepack (pnpm da versão do packageManager)
        run: corepack enable

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build (runner, sem limite de 1 GB)
        run: pnpm build

      - name: Compactar artefato
        run: tar -czf dist.tar.gz dist

      - name: Enviar artefato para o servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: dist.tar.gz
          target: ${{ secrets.HOSTINGER_PATH }}

      - name: Ativar no servidor (fonte + deps + swap do dist + restart)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          command_timeout: 15m
          script: |
            set -e

            NODE_BIN="/opt/alt/alt-nodejs22/root/usr/bin"
            PNPM="/opt/alt/alt-nodejs22/root/usr/lib/node_modules/corepack/shims/pnpm"
            export PATH="$NODE_BIN:$PATH"

            if [ ! -x "$NODE_BIN/node" ]; then echo "ERRO: Node nao encontrado"; exit 1; fi
            if [ ! -f "$PNPM" ]; then echo "ERRO: pnpm shim nao encontrado"; exit 1; fi

            cd "${{ secrets.HOSTINGER_PATH }}"

            echo "==> [1/5] Sincronizando fonte (blog, package.json) com origin/main"
            git fetch origin main
            git reset --hard origin/main

            echo "==> [2/5] Instalando dependencias de runtime (sem build)"
            "$PNPM" install --frozen-lockfile

            echo "==> [3/5] Restaurando bit de execucao dos binarios (workaround CageFS)"
            find node_modules -path "*/.bin/*" -type f -exec chmod +x {} \; 2>/dev/null || true

            echo "==> [4/5] Ativando o build enviado pelo runner"
            rm -rf dist
            tar -xzf dist.tar.gz
            rm -f dist.tar.gz

            echo "==> [4.5/5] Publicando no diretorio que o Passenger serve"
            # DESCOBERTO EM 06/09/2026 pelo diagnostico deste workflow:
            #
            #   ../.builds/current -> .../totalquality.med.br/hbuilds/versions/<uuid>
            #
            # A Hostinger tem sistema de build proprio ("hbuilds"): ela
            # reconstroi o app a partir do FONTE num diretorio versionado novo e
            # repontta o symlink `current`. O Passenger serve DE LA, e a
            # aplicacao fica em `<versao>/nodejs` (entry `dist/index.js`,
            # conforme o .metadata.json que a propria Hostinger grava).
            #
            # Ate 20/10/2026 este passo so OBSERVAVA isso, na suposicao de que a
            # Hostinger reconstruiria a cada push. Nesse dia ficou provado que
            # ela nao reconstroi: a lista de ligacoes entrou na main as 11:26,
            # CI e deploy verdes, e a URL devolveu 404. O diagnostico por SSH
            # mostrou o build servido parado em 19/10 01:13, com o fonte de
            # 246edd6 — duas publicacoes atras. Havia UMA unica versao em
            # hbuilds/versions, nenhuma nova. Ou seja: desde 19/10 nada do que
            # este workflow enviava chegava ao publico, e o deploy reportava
            # sucesso assim mesmo.
            #
            # Agora o pacote construido e testado no runner e copiado para
            # dentro do build servido. Isso conserta de uma vez o problema de
            # fundo: o que vai ao ar passa a ser exatamente o artefato que
            # passou nos testes, em vez de um build feito em outro lugar a
            # partir do fonte.
            #
            # A copia e por cima (`cp -a dist/.`), sem apagar o diretorio antes:
            # nao existe instante em que o site fica sem arquivos. O preco e que
            # chunks antigos ficam para tras — o que ate ajuda quem carregou o
            # index.html de um minuto atras — entao os assets com mais de 7 dias
            # sao podados no fim.
            CURRENT=$(readlink -f ../.builds/current 2>/dev/null || true)
            APP="${CURRENT:+$CURRENT/nodejs}"
            echo "    build servido: ${CURRENT:-nao encontrado}"
            echo "    repontado em: $(stat -c %y ../.builds/current 2>/dev/null | cut -d. -f1 || true)"

            PUBLICADO=0
            if [ -n "$APP" ] && [ -d "$APP/dist" ] && [ -w "$APP/dist" ]; then
              cp -a dist/. "$APP/dist/"
              find "$APP/dist/public/assets" -type f -mtime +7 -delete 2>/dev/null || true
              PUBLICADO=1
              echo "    publicado em $APP/dist"
              # Lido do index.html: o build gera mais de um assets/index-*.js, e
              # um `ls` pega o primeiro em ordem alfabetica, que nem sempre e o
              # bundle principal.
              echo "    bundle agora servido: $(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' \
                "$APP/dist/public/index.html" 2>/dev/null | head -1)"
            else
              echo "::warning::Nao foi possivel publicar em '$APP/dist' (inexistente \
              ou sem permissao de escrita). O site seguira servindo o build anterior."
            fi

            echo "==> [5/5] Restart via Phusion Passenger"
            # O Passenger observa tmp/restart.txt da RAIZ DA APLICACAO, que e o
            # diretorio servido — nao este. Enquanto so o de ca era tocado, o
            # restart nao acontecia.
            if [ -n "$APP" ] && [ -w "$APP" ]; then
              mkdir -p "$APP/tmp"
              touch "$APP/tmp/restart.txt"
              echo "    restart pedido em $APP/tmp/restart.txt"
            fi
            mkdir -p tmp
            touch tmp/restart.txt

            echo "==> Deploy OK em $(date '+%Y-%m-%d %H:%M:%S')"
            echo "    Node:  $(node --version)"
            echo "    Bundle: $(ls dist/public/assets/index-*.js 2>/dev/null | head -1)"

      # Ate 05/09/2026 o workflow declarava sucesso assim que o SSH saia com 0,
      # sem olhar para o site. Em 05/09 dois deploys "success" seguidos levaram
      # minutos de investigacao ate ficar claro que um tinha subido e o outro
      # nao. O passo abaixo pergunta ao site, nao ao servidor.
      # Verifica que o SITE esta saudavel depois do deploy.
      #
      # Entre 06/09 e 20/10/2026 este passo NAO comparava o bundle servido com o
      # que o runner acabara de construir, porque na topologia de entao isso
      # nunca podia ser verdade: a Hostinger servia um build proprio. O passo se
      # contentava com "o site responde e o HTML esta integro".
      #
      # Foi exatamente por isso que o deploy de 20/10 reportou sucesso enquanto
      # a pagina nova devolvia 404: o site respondia — servindo o build de dois
      # dias antes. Agora que o passo [4.5] publica no diretorio servido, a
      # comparacao voltou a ser possivel, e ela e a unica que prova que o que
      # esta no ar e o que foi testado aqui.
      - name: Verificar a producao (o site, nao o servidor)
        run: |
          set -e
          # O bundle esperado sai do index.html construido, nao de um `ls`: o
          # build gera mais de um arquivo assets/index-*.js (o principal, de
          # ~450 KB, e um pedaco menor), e `ls | head -1` pega o primeiro em
          # ordem alfabetica, que pode ser o pedaco errado. Foi o que reprovou o
          # deploy de 20/10 depois de ele ter publicado corretamente: comparou
          # um chunk de 34 KB com o bundle principal servido. Lendo do
          # index.html dos dois lados, a comparacao e entre as mesmas coisas.
          ESPERADO=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/public/index.html | head -1)
          if [ -z "$ESPERADO" ]; then
            echo "::error::Nao achei a referencia de assets/index-*.js no index.html \
            construido. O build saiu diferente do esperado."
            exit 1
          fi
          echo "Bundle construido e testado no runner: $ESPERADO"

          # O CDN da Hostinger cacheia HTML por 300s; furar o cache e obrigatorio.
          OK=0
          SERVIDO=""
          for TENTATIVA in 1 2 3 4 5 6; do
            HTML=$(curl -fsS --max-time 25 -H "Cache-Control: no-cache" \
              "https://totalquality.med.br/?deploy_check=${GITHUB_SHA}${TENTATIVA}" || true)

            SERVIDO=$(printf '%s' "$HTML" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)
            TEM_ROOT=$(printf '%s' "$HTML" | grep -c '<div id="root"' || true)

            if [ "${SERVIDO:-nenhum}" = "$ESPERADO" ] && [ "$TEM_ROOT" -ge 1 ]; then
              echo "OK: site respondendo, HTML integro, servindo o bundle desta publicacao"
              OK=1
              break
            fi
            echo "  tentativa $TENTATIVA: servindo '${SERVIDO:-nada}', esperado '$ESPERADO' — aguardando 20s"
            sleep 20
          done

          if [ "$OK" -ne 1 ]; then
            echo "::error::Apos ~2min a producao nao serve o bundle desta publicacao \
            (servindo '${SERVIDO:-nada}', esperado '$ESPERADO'). O deploy nao chegou \
            ao publico — foi assim que a pagina nova de 20/10 ficou em 404 com o \
            deploy verde."
            exit 1
          fi

          # Caminho de primeiro nivel inexistente tem de dar 404 real. So responde
          # certo se o servidor estiver rodando o codigo atual, entao serve de
          # prova de que o deploy propagou — sem depender do hash do bundle.
          CODIGO=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "https://totalquality.med.br/verificacao-de-deploy-${GITHUB_SHA}")
          if [ "$CODIGO" != "404" ]; then
            echo "::error::Endereco inexistente devolveu $CODIGO em vez de 404 — \
            o servidor pode estar rodando codigo antigo."
            exit 1
          fi
          echo "OK: 404 real em caminho inexistente — servidor rodando o codigo atual"
