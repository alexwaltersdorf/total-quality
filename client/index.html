    <!-- CSS critico. O bloco pre-renderizado (server/_core/seo-content.ts) e o
         primeiro paint da pagina, e desde a P1.2 a folha principal nao bloqueia
         mais a renderizacao (ver nonBlockingCss em vite.config.ts) — entao tudo
         que esse bloco precisa para aparecer certo tem que estar aqui.
         Nao ocultar o bloco: o conteudo precisa ser rastreavel. -->
    <style>
      /* Reset minimo: a preflight do Tailwind chega junto com a folha principal,
         que agora e assincrona. Sem isto o body teria a margem de 8px do
         navegador no primeiro paint e o texto saltaria quando o CSS chegasse. */
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; background: #fff; }
      .seo-prerender h1, .seo-prerender h2, .seo-prerender h3 { font-weight: 600; }
      .seo-prerender ul { list-style: disc; }
      .seo-prerender a { text-decoration: none; }
      .seo-prerender {
        max-width: 68ch;
        margin: 0 auto;
        padding: 6rem 1.5rem 4rem;
        font-family: "DM Sans", system-ui, -apple-system, sans-serif;
        color: #5a5a5a;
        line-height: 1.7;
      }
      .seo-prerender h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.1; color: #1a1a1a; margin-bottom: 1rem; }
      .seo-prerender h2 { font-size: 1.5rem; color: #1a1a1a; margin: 2.5rem 0 0.75rem; }
      .seo-prerender h3 { font-size: 1.125rem; color: #1a1a1a; margin: 1.5rem 0 0.5rem; }
      .seo-prerender p, .seo-prerender ul, .seo-prerender address { margin-bottom: 1rem; }
      .seo-prerender ul { padding-left: 1.25rem; }
      .seo-prerender a { color: #9b212b; }
    </style>
